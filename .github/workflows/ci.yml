name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: offerlight
          POSTGRES_PASSWORD: offerlight
          POSTGRES_DB: offerlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U offerlight" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://offerlight:offerlight@localhost:5432/offerlight
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
      - name: Privacy checks (inventory, models, plans, consent wording, generated ROPA)
        run: uv run pytest tests/privacy -q --no-cov
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest --cov-fail-under=80
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-hashes > /tmp/req.txt && uv run pip-audit -r /tmp/req.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tokens are up to date
        run: npm run tokens && git diff --exit-code src/styles/tokens.css
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build && (npx vite preview --port 5173 &) && npx wait-on http://localhost:5173
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          load: true
          tags: offerlight-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          load: true
          tags: offerlight-frontend:ci
      - name: Scan images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: offerlight-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
