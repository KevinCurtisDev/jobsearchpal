[[ephemeral]]
key = "auth:code:<hmac(email)>"
store = "redis"
category = "transient_auth"
ttl_seconds = 600

[[ephemeral]]
key = "auth:magic:<sha256(token)>"
store = "redis"
category = "transient_auth"
ttl_seconds = 600

[[ephemeral]]
key = "webauthn:challenge:<random>"
store = "redis"
category = "transient_auth"
ttl_seconds = 300

[[ephemeral]]
key = "rl:<scope>:<hmac(ip|email)>"
store = "redis"
category = "transient_auth"
ttl_seconds = 3600

[[ephemeral]]
key = "export:<user_id>.zip (object storage)"
store = "object_storage"
category = "account_identity"
ttl_seconds = 86400

[[ephemeral]]
key = "ai:cache:<sha256(prompt_version|model|input)>"
store = "redis"
category = "cv_content"
ttl_seconds = 604800

[[ephemeral]]
key = "cv-check upload (object storage, no account)"
store = "object_storage"
category = "cv_content"
ttl_seconds = 86400
