id = "erasure_tombstones"
name = "Erasure tombstones"
description = "Keyed hash of an erased user's id and email, erased_at. Used to re-apply erasure after a backup restore."
data_subjects = ["former_users"]
purposes = ["Make erasure stick after a backup restore"]
lawful_basis = "legal_obligation"
legal_ref = "GDPR Art 17 — erasure must remain effective"
retention = { policy = "fixed", days = 60 }
retention_note = "Longer than the backup retention (30 days) so every backup that could contain the user has expired"
on_erasure = "retain_legal"
export = false
export_exempt_reason = "Created after erasure; holds only a keyed hash"
processors = ["hetzner", "scaleway", "backup_storage"]
source = "system"
stage = 1

[[categories]]
id = "privacy_incidents"
name = "Personal data breach register"
description = "Every personal data breach, its facts, effects and remedial action — including breaches not notified"
data_subjects = ["users", "former_users"]
purposes = ["Comply with GDPR Art 33(5)", "Learn from incidents"]
lawful_basis = "legal_obligation"
legal_ref = "GDPR Art 33(5)"
retention = { policy = "fixed", days = 2190 }
on_erasure = "retain_legal"
retain_note = "Holds counts and categories, not individual identities"
export = false
export_exempt_reason = "Register contains no individual-level personal data"
processors = ["hetzner", "scaleway", "backup_storage"]
source = "system"
stage = 1

[[categories]]
id = "application_logs"
stored_in = "Container logs on the server (rotated) and Sentry (EU region)"
name = "Application and error logs"
description = "Request ids, user ids (never emails), routes, errors. PII is redacted by app.privacy.redaction before anything is written."
data_subjects = ["users"]
purposes = ["Operate and debug the service"]
lawful_basis = "legitimate_interests"
lia_ref = "docs/privacy/lia/0002-service-operation-and-cost-control.md"
retention = { policy = "fixed", days = 30 }
on_erasure = "delete"
retention_note = "Enforced by log-shipper/Sentry retention settings, not by the database job"
export = false
export_exempt_reason = "Operational logs keyed by user id only; available on request through a manual DSAR"
processors = ["hetzner", "sentry"]
source = "system"
stage = 0

[[categories]]
id = "not_personal"
name = "Not personal data"
description = "Reference data, company (legal person) data, aggregates with k >= 10, configuration"
data_subjects = []
purposes = ["Run the service"]
lawful_basis = "not_applicable"
retention = { policy = "not_applicable" }
on_erasure = "not_applicable"
export = false
export_exempt_reason = "Not personal data"
processors = []
source = "system"
stage = 0

# ---------------------------------------------------------------------------------------------
# Tables. `category` classifies every column; `columns` overrides individual columns.
# user_column     column holding the user id (erasure deletes or anonymises by it)
# cascade_from    parent table whose deletion removes these rows (FK must be ON DELETE CASCADE)
# retention_clock timestamp column the fixed-retention timer runs from
# keep_column     boolean column that pauses fixed retention while true (user chose 'Keep')
# encrypted       columns encrypted at rest at application level
# storage_keys    columns holding object-storage keys (objects deleted with the row)
# ---------------------------------------------------------------------------------------------

