# Offerlight data inventory — the single source of truth for personal data.
#
# Every table, column, cache key and processor that touches personal data is declared here,
# with its purpose, lawful basis, retention, erasure and export behaviour.
#
# This file is enforced in code and CI (backend/tests/privacy/):
#   - the inventory must validate (no category without a lawful basis, retention or erasure rule);
#   - every table in docs/04-data-model.md and every SQLAlchemy table must be listed here;
#   - every column of a model must be classified (by its table's default category or an override);
#   - foreign keys must match the declared erasure behaviour (CASCADE / SET NULL);
#   - docs/privacy/records-of-processing.md must be regenerated after any change (make privacy-docs).
#
# Changing this file changes how we handle people's data. Every change needs owner review
# (see CLAUDE.md "When to stop and ask") and, where marked, solicitor/DPO review.
# Engineering specification only, not legal advice.

schema_version = 1
last_reviewed = "2026-10-20"
minimum_age = 16                       # self-declared at sign-up; no date of birth is collected

[controller]
name = "TBC — company to be incorporated (decisions-needed #15)"
establishment = "Ireland"
lead_supervisory_authority = "Data Protection Commission (Ireland)"
uk_regulator = "Information Commissioner's Office"
uk_representative = "TBC (decisions-needed #16)"
privacy_contact = "privacy@<domain>"
dpo = "TBC (decisions-needed #17)"

# ---------------------------------------------------------------------------------------------
# Processors (sub-processors). A category may only send data to processors listed here.
# outside_eea = true requires a transfer_mechanism. dpa must be signed before first use.
# ---------------------------------------------------------------------------------------------

[[processors]]
id = "hetzner"
name = "Hetzner Online GmbH"
service = "Servers, load balancer and object storage (all hosting tiers)"
location = "Germany / Finland (EU)"
outside_eea = false
dpa = "Sign the data processing agreement in the Hetzner console before Stage 0 deploy"
from_stage = 0

[[processors]]
id = "scaleway"
name = "Scaleway SAS"
service = "Managed PostgreSQL (Tier 1+)"
location = "France (EU)"
outside_eea = false
dpa = "Accept the Scaleway DPA before Tier 1"
from_stage = 4

[[processors]]
id = "upstash"
name = "Upstash, Inc."
service = "Managed Redis (Tier 1+): sessions cache, rate limits, job queue"
location = "EU region (eu-west-1 or eu-central-1)"
outside_eea = true
transfer_mechanism = "US parent company: EU-US Data Privacy Framework if certified at signing, otherwise Standard Contractual Clauses + transfer impact assessment. Data stored in an EU region."
dpa = "Sign the Upstash DPA before Tier 1"
from_stage = 4

[[processors]]
id = "backup_storage"
name = "Off-site backup object storage (provider per decisions-needed #2)"
service = "Encrypted nightly database backups (GPG, key held by owners)"
location = "EU, different provider from the servers"
outside_eea = false
dpa = "Sign before Stage 0 backups start"
from_stage = 0

[[processors]]
id = "cloudflare"
name = "Cloudflare, Inc."
service = "Turnstile bot check, Pages static hosting, DNS"
location = "Global network; EU customer data localisation where available"
outside_eea = true
transfer_mechanism = "EU-US Data Privacy Framework (verify certification at signing) + Cloudflare DPA with SCCs"
dpa = "Accept the Cloudflare DPA before Stage 1"
from_stage = 1

[[processors]]
id = "amazon_ses"
name = "Amazon Web Services EMEA SARL (Amazon SES)"
service = "Transactional email (codes, alerts, digests) and inbound reply capture"
location = "eu-west-1 (Ireland)"
outside_eea = true
transfer_mechanism = "Processing in eu-west-1; US parent: AWS DPA with SCCs, EU-US Data Privacy Framework"
dpa = "AWS GDPR DPA (part of the AWS service terms) — confirm before Stage 1"
from_stage = 1

[[processors]]
id = "anthropic"
name = "Anthropic (Claude API)"
service = "Writing suggestions, messy-text parsing, interview answer feedback — only when the user asks"
location = "United States"
outside_eea = true
transfer_mechanism = "Commercial terms with DPA and SCCs; transfer impact assessment. Contact details are removed before every call (app.privacy.ai_guard). Confirm API data-retention terms and request zero data retention if offered."
dpa = "Sign the Anthropic DPA before Stage 2"
from_stage = 2

[[processors]]
id = "stripe"
name = "Stripe Payments Europe, Ltd."
service = "Payments and invoices. Stripe holds card data; we never see card numbers."
location = "Ireland (EU), with transfers to Stripe, Inc. (US)"
outside_eea = true
transfer_mechanism = "Stripe DPA with SCCs and EU-US Data Privacy Framework. Stripe is an independent controller for some payment data (fraud, regulatory)."
dpa = "Stripe DPA (part of the Stripe Services Agreement) — confirm before Stage 4"
from_stage = 4

[[processors]]
id = "sentry"
name = "Functional Software, Inc. (Sentry)"
service = "Error monitoring. PII scrubbing on (send_default_pii = false + app.privacy.redaction)."
location = "EU data region (de.sentry.io)"
outside_eea = true
transfer_mechanism = "EU data region; US parent: Sentry DPA with SCCs"
dpa = "Accept the Sentry DPA before Stage 0 error monitoring goes live"
from_stage = 0

[[processors]]
id = "plausible"
name = "Plausible Insights OÜ (or self-hosted Umami — no processor)"
service = "Cookieless, aggregate page analytics. No personal data stored."
location = "Germany (EU)"
outside_eea = false
dpa = "Accept the Plausible DPA before Stage 4"
from_stage = 4

# ---------------------------------------------------------------------------------------------
# Categories of personal data. Each has exactly one lawful basis.
#
# lawful_basis: contract (Art 6(1)(b)) | consent (6(1)(a)) | legitimate_interests (6(1)(f))
#               | legal_obligation (6(1)(c))
# Special category data also needs art9_condition.
# retention.policy:
#   account_lifetime        kept while the account exists; removed by erasure
#   fixed                   removed `days` after the table's retention_clock column
#   after_account_deletion  kept `days` after the account is erased (legal reasons only)
#   until_withdrawn         removed as soon as the linked consent is withdrawn, or by erasure
#   transient               never stored beyond `seconds` (processing only)
# on_erasure: delete | anonymise (user link set to NULL; row must not identify anyone after)
#             | retain_legal (kept for a legal obligation until its retention ends)
# ---------------------------------------------------------------------------------------------

[[categories]]
id = "account_identity"
name = "Account identity"
description = "Email address, display name, locale, country, account status, plan"
data_subjects = ["users"]
purposes = ["Create and run the user's account", "Sign-in by email code", "Service emails"]
lawful_basis = "contract"
retention = { policy = "account_lifetime" }
on_erasure = "delete"
export = true
processors = ["hetzner", "scaleway", "backup_storage", "amazon_ses"]
source = "user"
stage = 1

[[categories]]
id = "authentication"
name = "Passkeys and sign-in credentials"
description = "WebAuthn public keys, credential ids, sign counts, authenticator metadata, nicknames"
data_subjects = ["users"]
purposes = ["Passwordless sign-in"]
lawful_basis = "contract"
retention = { policy = "account_lifetime" }
on_erasure = "delete"
export = true
export_fields_note = "Nickname, created and last-used dates only; key material is not useful to the user"
processors = ["hetzner", "scaleway", "backup_storage"]
source = "user"
stage = 1

[[categories]]
id = "sessions"
name = "Sessions and devices"
description = "Session token hashes, device label, user agent, keyed IP hash, last seen"
data_subjects = ["users"]
purposes = ["Keep users signed in", "Show and revoke devices", "Detect account takeover"]
lawful_basis = "legitimate_interests"
lia_ref = "docs/privacy/lia/0001-security-and-fraud-prevention.md"
retention = { policy = "fixed", days = 90 }
on_erasure = "delete"
export = true
processors = ["hetzner", "scaleway", "upstash", "backup_storage"]
source = "system"
stage = 1

[[categories]]
id = "transient_auth"
name = "One-time codes, magic links, WebAuthn challenges, rate-limit counters"
description = "Hashed codes and tokens, keyed hashes of email/IP in rate-limit keys"
data_subjects = ["users", "people_attempting_sign_up"]
purposes = ["Verify email ownership", "Prevent brute force and bot sign-ups"]
lawful_basis = "legitimate_interests"
lia_ref = "docs/privacy/lia/0001-security-and-fraud-prevention.md"
retention = { policy = "transient", seconds = 3600 }
on_erasure = "delete"
export = false
export_exempt_reason = "Exists for at most one hour and holds only hashes"
processors = ["hetzner", "upstash"]
source = "system"
stage = 0

[[categories]]
id = "security_audit"
name = "Security audit log"
description = "Sign-ins, passkey changes, exports, deletions, consent changes; keyed IP hash"
data_subjects = ["users"]
purposes = ["Security investigation", "Demonstrate correct handling of rights requests"]
lawful_basis = "legitimate_interests"
lia_ref = "docs/privacy/lia/0001-security-and-fraud-prevention.md"
retention = { policy = "fixed", days = 365 }
on_erasure = "anonymise"
export = true
processors = ["hetzner", "scaleway", "backup_storage"]
source = "system"
stage = 1

[[categories]]
id = "consent_records"
name = "Consent records"
description = "Append-only history of each consent: kind, version, granted/withdrawn, time, source"
data_subjects = ["users"]
purposes = ["Prove consent was given (GDPR Art 7(1))", "Apply the user's current choices"]
lawful_basis = "legal_obligation"
legal_ref = "GDPR Art 7(1) — controller must be able to demonstrate consent"
retention = { policy = "after_account_deletion", days = 2190 }
on_erasure = "retain_legal"
retain_note = "On erasure user_id is replaced by subject_ref (keyed hash of the email) so the record proves consent without identifying the account. 6 years = Irish limitation period for contract claims; confirm with solicitor."
export = true
processors = ["hetzner", "scaleway", "backup_storage"]
source = "user"
stage = 1

[[categories]]
id = "ai_usage"
