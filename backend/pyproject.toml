[project]
name = "offerlight-backend"
version = "0.1.0"
description = "Offerlight API, workers and ML"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "dnspython>=2.6",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.4",
  "sentry-sdk>=2.10",
  "prometheus-fastapi-instrumentator>=7.0",
  "webauthn>=2.2",
  "boto3>=1.34",
]

[project.optional-dependencies]
# Stage 2: CV parsing and document generation
cv = [
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "python-magic>=0.4.27",
  "jinja2>=3.1",
  "weasyprint>=62",
  "anthropic>=0.40",
]
# Stages 3, 5, 6, 8, 9, 11: retrieval, statistics and ML
ml = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "lightgbm>=4.4",
  "shap>=0.45",
  "lifelines>=0.29",
  "datasketch>=1.6",
  "rapidfuzz>=3.9",
  "rank-bm25>=0.2.2",
  "pgvector>=0.3",
  "sentence-transformers>=3.0",
]
# Stage 10: speech-to-text for practice recordings
speech = [
  "faster-whisper>=1.0",
]
# Stage 4: payments
billing = [
  "stripe>=10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"migrations/**" = ["E501"]
# SQL identifiers come only from data_inventory.toml and are validated by registry._IDENT
"app/privacy/plans.py" = ["S608"]
"app/workers/privacy_tasks.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered"

[tool.coverage.run]
omit = ["app/workers/*", "app/db/*"]
