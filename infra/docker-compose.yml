# Local development stack. Run from the repo root with `make up`.
name: offerlight

x-backend: &backend
  build:
    context: ../backend
    target: dev
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://offerlight:offerlight@postgres:5432/offerlight
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    S3_ENDPOINT: http://minio:9000
  volumes:
    - ../backend/app:/app/app
    - ../backend/migrations:/app/migrations
    - ../backend/tests:/app/tests
    - ../content:/content:ro
    - ../prompts:/prompts:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: offerlight
      POSTGRES_PASSWORD: offerlight
      POSTGRES_DB: offerlight
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerlight"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: offerlight
      MINIO_ROOT_PASSWORD: offerlight-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "--concurrency", "2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]

  frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
